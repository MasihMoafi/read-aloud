name: Verify installed player shutdown
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installed player source
        run: node --check electron/main.cjs
      - name: Install isolated window test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xdotool python3-xlib libgtk-3-0t64 libnss3 libasound2t64
          npm ci --no-audit --no-fund
      - name: Prepare a silent player fixture
        run: |
          mkdir -p "$RUNNER_TEMP/player/electron"
          ln -s "$PWD/node_modules/electron/dist/electron" "$RUNNER_TEMP/player/electron/electron"
          printf '<!doctype html><title>Read Aloud</title><body>Read Aloud</body>' > "$RUNNER_TEMP/player/index.html"
          touch "$RUNNER_TEMP/player/logo.png"
      - name: Check window close and idle lifetime in real Electron
        env:
          READ_ALOUD_BUILD: ${{ runner.temp }}/player
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a nice -n 19 python3 tests/app_lifetime.py
