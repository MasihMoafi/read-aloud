<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example passage</title>
  <style>
    @font-face { font-family: Inter; src: url("assets/fonts/inter-regular.otf"); font-weight: 400; }
    @font-face { font-family: Inter; src: url("assets/fonts/inter-bold.otf"); font-weight: 700; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e6eeec; color: #182a2a; font-family: Inter, sans-serif; }
    main { width: 1120px; min-height: 590px; margin: 64px auto; padding: 74px 80px; background: #fff; }
    .label { color: #147d78; font-size: 19px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 30px 0 46px; font-size: 54px; letter-spacing: -.035em; }
    p { margin: 0; font-size: 30px; line-height: 1.5; }
    #sample { white-space: nowrap; }
    .hint { margin-top: 42px; color: #687a77; font-size: 20px; }
    ::selection { background: #89d8cd; color: #142d2a; }
  </style>
</head>
<body>
  <main>
    <div class="label">Example passage</div>
    <h1>Give your eyes a break</h1>
    <p><span id="sample">Select a passage, press Super R, and listen as you work.</span></p>
    <p class="hint">Highlight the sentence to hear it read aloud.</p>
  </main>
</body>
</html>
